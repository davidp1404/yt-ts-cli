[project]
name = "yt-ts-cli"
version = "0.3.1"
description = "YouTube Transcript CLI - Download and convert YouTube video transcripts to plain text"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "YouTube Transcript CLI", email = "david.palau@gmail.com"}
]
license = {text = "MIT"}
keywords = ["youtube", "transcript", "subtitles", "cli", "download"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = [
    "yt-dlp>=2023.1.6",
]

[project.urls]
Homepage = "https://github.com/davidp1404/yt-ts-cli"
Repository = "https://github.com/davidp1404/yt-ts-cli.git"
Issues = "https://github.com/davidp1404/yt-ts-cli/issues"

[project.scripts]
yt-ts-cli = "yt_ts_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_ts_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]
